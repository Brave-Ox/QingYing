<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <style>
      .bg{fill:#081827}.group{fill:#0D2233;stroke:#315A78;stroke-width:2}.layer{font:700 16px 'Microsoft YaHei',sans-serif;fill:#91AEC7;letter-spacing:1px}.t{font:700 18px 'Microsoft YaHei',sans-serif;fill:#142A43}.s{font:400 13px 'Microsoft YaHei',sans-serif;fill:#50657A}.xs{font:400 12px 'Microsoft YaHei',sans-serif;fill:#6B8298}.wt{font:700 18px 'Microsoft YaHei',sans-serif;fill:#FFF}.ws{font:400 13px 'Microsoft YaHei',sans-serif;fill:#D9E8F5}.line{fill:none;stroke:#8BA6BF;stroke-width:2.2;marker-end:url(#a)}.bi{fill:none;stroke:#8BA6BF;stroke-width:2.2;marker-start:url(#ar);marker-end:url(#a)}.dash{fill:none;stroke:#E8B257;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#ao)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8BA6BF"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto"><path d="M9 0L0 3L9 6Z" fill="#8BA6BF"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#E8B257"/></marker>
  </defs>
  <rect class="bg" width="1600" height="720"/>

  <!-- MCP subprocess -->
  <rect x="280" y="35" width="320" height="650" rx="20" class="group"/>
  <text x="305" y="70" class="layer">QINGYING --MCP-STDIO 子进程</text>
  <text x="35" y="70" class="layer">外部宿主</text>
  <rect x="35" y="98" width="200" height="88" rx="13" fill="#286195"/>
  <text x="135" y="133" text-anchor="middle" class="wt">MCP Host</text>
  <text x="135" y="159" text-anchor="middle" class="ws">initialize · tools/call</text>
  <rect x="310" y="98" width="255" height="88" rx="13" fill="#DCEBFA" stroke="#5794D4" stroke-width="2"/>
  <text x="438" y="133" text-anchor="middle" class="t">StdioTransport</text>
  <text x="438" y="159" text-anchor="middle" class="s">JSON-RPC 输入 / 输出</text>
  <path d="M235 142 L308 142" class="bi"/>

  <rect x="310" y="238" width="255" height="110" rx="14" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2"/>
  <text x="438" y="274" text-anchor="middle" class="t">McpBridge</text>
  <text x="438" y="299" text-anchor="middle" class="s">McpProtocolSession</text>
  <text x="438" y="324" text-anchor="middle" class="xs">握手 · 跟踪 · 取消 · 输出</text>
  <path d="M438 186 L438 236" class="bi"/>

  <rect x="310" y="392" width="255" height="78" rx="13" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="438" y="423" text-anchor="middle" class="t">ToolCatalog</text>
  <text x="438" y="449" text-anchor="middle" class="s">Schema · 解码 · 编码</text>
  <path d="M438 350 L438 390" class="bi"/>

  <rect x="310" y="520" width="255" height="100" rx="14" fill="#DDF3E7" stroke="#45A479" stroke-width="2"/>
  <text x="438" y="557" text-anchor="middle" class="t">PipeAutomationClient</text>
  <text x="438" y="582" text-anchor="middle" class="s">IAutomationClient</text>
  <text x="438" y="604" text-anchor="middle" class="xs">不重连 · 不重放</text>
  <path d="M438 470 L438 518" class="bi"/>

  <!-- trust boundary -->
  <text x="625" y="70" class="layer">本机 IPC 信任边界</text>
  <rect x="655" y="105" width="130" height="515" rx="20" fill="#152F43" stroke="#E8B257" stroke-width="2.5" stroke-dasharray="8 6"/>
  <text x="720" y="302" text-anchor="middle" class="wt" transform="rotate(-90 720 302)">Windows Named Pipe</text>
  <text x="742" y="438" text-anchor="middle" class="ws" transform="rotate(-90 742 438)">私有 Wire Codec</text>
  <path d="M565 570 L653 570" class="bi"/>

  <!-- desktop process -->
  <rect x="820" y="35" width="745" height="650" rx="20" class="group"/>
  <text x="850" y="70" class="layer">QINGYING GUI 主进程</text>

  <rect x="850" y="98" width="230" height="98" rx="13" fill="#FBE7E7" stroke="#D27B7B" stroke-width="2"/>
  <text x="965" y="135" text-anchor="middle" class="t">PipeServer</text>
  <text x="965" y="160" text-anchor="middle" class="s">认证连接 · I/O 队列</text>
  <text x="965" y="181" text-anchor="middle" class="xs">不直接访问业务对象</text>
  <path d="M787 570 L815 570 L815 147 L848 147" class="bi"/>

  <rect x="1140" y="98" width="230" height="98" rx="13" fill="#DCEBFA" stroke="#5794D4" stroke-width="2"/>
  <text x="1255" y="135" text-anchor="middle" class="t">UiActionScheduler</text>
  <text x="1255" y="160" text-anchor="middle" class="s">有界排队 · 切换 UI 线程</text>
  <text x="1255" y="181" text-anchor="middle" class="xs">请求 / 完成仅结算一次</text>
  <path d="M1080 147 L1138 147" class="bi"/>

  <rect x="970" y="244" width="330" height="112" rx="14" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="1135" y="280" text-anchor="middle" class="t">AutomationEndpoint</text>
  <text x="1135" y="305" text-anchor="middle" class="s">OperationCoordinator</text>
  <text x="1135" y="330" text-anchor="middle" class="xs">身份上下文 · 能力准入 · Scope 校验</text>
  <path d="M1255 196 L1255 220 L1135 220 L1135 242" class="bi"/>

  <rect x="1360" y="244" width="175" height="112" rx="14" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2"/>
  <text x="1448" y="280" text-anchor="middle" class="t">OperationRegistry</text>
  <text x="1448" y="305" text-anchor="middle" class="s">操作生命周期</text>
  <text x="1448" y="330" text-anchor="middle" class="xs">不透明句柄</text>
  <path d="M1300 300 L1358 300" class="bi"/>

  <rect x="970" y="405" width="330" height="82" rx="13" fill="#DDF3E7" stroke="#45A479" stroke-width="2"/>
  <text x="1135" y="437" text-anchor="middle" class="t">AutomationWorkflowAdapter</text>
  <text x="1135" y="463" text-anchor="middle" class="s">自动化契约 → 统一业务入口</text>
  <path d="M1135 356 L1135 403" class="bi"/>

  <rect x="970" y="535" width="330" height="92" rx="14" fill="#286195"/>
  <text x="1135" y="570" text-anchor="middle" class="wt">ActionDispatcher</text>
  <text x="1135" y="596" text-anchor="middle" class="ws">类型化 Action · 统一执行</text>
  <path d="M1135 487 L1135 533" class="line"/>

  <rect x="835" y="535" width="105" height="92" rx="13" fill="#DCEBFA" stroke="#5794D4" stroke-width="2"/>
  <text x="888" y="568" text-anchor="middle" class="t">业务服务</text>
  <text x="888" y="592" text-anchor="middle" class="xs">Capture</text>
  <text x="888" y="610" text-anchor="middle" class="xs">Copy/Save/Pin</text>
  <path d="M970 581 L942 581" class="line"/>

  <rect x="1360" y="535" width="175" height="92" rx="13" fill="#CDEADD" stroke="#45A479" stroke-width="2"/>
  <text x="1448" y="570" text-anchor="middle" class="t">ResultStore</text>
  <text x="1448" y="596" text-anchor="middle" class="s">按连接 Scope 隔离</text>
  <path d="M940 614 L940 650 L1448 650 L1448 629" class="line"/>
  <path d="M1300 446 L1448 446 L1448 533" class="bi"/>

  <!-- thread boundary -->
  <path d="M835 216 L1545 216" stroke="#315A78" stroke-width="1.5" stroke-dasharray="6 6"/>
  <text x="850" y="211" class="xs">I/O / worker</text>
  <text x="850" y="237" class="xs">UI thread / trusted boundary</text>
</svg>
