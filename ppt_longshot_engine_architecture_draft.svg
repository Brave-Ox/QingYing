<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720">
  <defs>
    <style>
      .bg{fill:#081827}.layer{font:700 15px 'Microsoft YaHei',sans-serif;fill:#91AEC7;letter-spacing:1px}.t{font:700 18px 'Microsoft YaHei',sans-serif;fill:#142A43}.s{font:400 13px 'Microsoft YaHei',sans-serif;fill:#50657A}.xs{font:400 12px 'Microsoft YaHei',sans-serif;fill:#6B8298}.wt{font:700 18px 'Microsoft YaHei',sans-serif;fill:#FFF}.ws{font:400 13px 'Microsoft YaHei',sans-serif;fill:#D9E8F5}.gt{font:700 18px 'Microsoft YaHei',sans-serif;fill:#123D35}.line{fill:none;stroke:#8BA6BF;stroke-width:2.2;marker-end:url(#a)}.back{fill:none;stroke:#8BA6BF;stroke-width:2;marker-end:url(#a)}.dash{fill:none;stroke:#E8B257;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#ao)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8BA6BF"/></marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#E8B257"/></marker>
  </defs>
  <rect class="bg" width="1600" height="720"/>

  <text x="60" y="48" class="layer">交互编排</text>
  <rect x="60" y="68" width="270" height="102" rx="14" fill="#286195"/>
  <text x="195" y="108" text-anchor="middle" class="wt">CaptureWorkflow</text>
  <text x="195" y="134" text-anchor="middle" class="ws">选区 · 启动 · 结果决策</text>
  <rect x="60" y="220" width="270" height="102" rx="14" fill="#DCEBFA" stroke="#5794D4" stroke-width="2"/>
  <text x="195" y="260" text-anchor="middle" class="t">SelectionOverlay</text>
  <text x="195" y="286" text-anchor="middle" class="s">控制 · 预览 · 恢复选择</text>
