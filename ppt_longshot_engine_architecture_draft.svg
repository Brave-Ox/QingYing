  <rect x="390" y="68" width="300" height="132" rx="14" fill="#163D64" stroke="#5E99CA" stroke-width="2"/>
  <text x="540" y="108" text-anchor="middle" class="wt">LongShotController</text>
  <text x="540" y="136" text-anchor="middle" class="ws">Worker 生命周期</text>
  <text x="540" y="160" text-anchor="middle" class="ws">控制令牌 · 进度/完成消息</text>
  <path d="M330 119 L388 119" class="line"/>
  <path d="M390 174 L348 174 L348 270 L332 270" class="back"/>

  <text x="750" y="48" class="layer">引擎核心</text>
  <rect x="750" y="68" width="500" height="584" rx="18" fill="#102A3D" stroke="#4D8AC0" stroke-width="2.5"/>
  <text x="1000" y="108" text-anchor="middle" class="wt">LongShotEngine</text>
  <text x="1000" y="133" text-anchor="middle" class="ws">同步采集与拼接服务</text>
  <rect x="790" y="164" width="270" height="72" rx="11" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="925" y="192" text-anchor="middle" class="t">LongShotProfile</text>
  <text x="925" y="215" text-anchor="middle" class="s">识别目标 · 滚动 · 查询状态</text>
  <rect x="1080" y="164" width="130" height="72" rx="11" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2"/>
  <text x="1145" y="192" text-anchor="middle" class="t">Limits</text>
  <text x="1145" y="215" text-anchor="middle" class="xs">时间/高度/内存</text>
  <rect x="790" y="286" width="126" height="92" rx="11" fill="#DCEBFA" stroke="#5794D4" stroke-width="2"/>
  <text x="853" y="322" text-anchor="middle" class="t">捕获</text>
  <text x="853" y="349" text-anchor="middle" class="s">CaptureEngine</text>
  <rect x="937" y="286" width="126" height="92" rx="11" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="1000" y="322" text-anchor="middle" class="t">稳定</text>
  <text x="1000" y="349" text-anchor="middle" class="s">FrameSettler</text>
  <rect x="1084" y="286" width="126" height="92" rx="11" fill="#DDF3E7" stroke="#45A479" stroke-width="2"/>
  <text x="1147" y="322" text-anchor="middle" class="t">拼接</text>
  <text x="1147" y="349" text-anchor="middle" class="s">ImageStitcher</text>
  <path d="M916 332 L935 332" class="line"/>
  <path d="M1063 332 L1082 332" class="line"/>
  <path d="M1147 378 L1147 414 L853 414 L853 380" class="back"/>
