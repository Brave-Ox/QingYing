  <rect x="790" y="450" width="420" height="72" rx="11" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2"/>
  <text x="1000" y="480" text-anchor="middle" class="t">LongShotOutcome</text>
  <text x="1000" y="504" text-anchor="middle" class="s">可信图像 · 质量 · 停止原因</text>
  <path d="M1000 414 L1000 448" class="line"/>
  <rect x="790" y="560" width="420" height="56" rx="11" fill="#173C57" stroke="#4D718D" stroke-width="2"/>
  <text x="1000" y="594" text-anchor="middle" class="ws">取消与资源预算贯穿整个采集循环</text>
  <path d="M690 133 L748 133" class="line"/>
  <path d="M790 486 L716 486 L716 178 L692 178" class="back"/>
  <text x="720" y="472" class="xs">进度 / Outcome</text>

  <text x="390" y="268" class="layer">适配器装配</text>
  <rect x="390" y="288" width="300" height="86" rx="13" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2"/>
  <text x="540" y="321" text-anchor="middle" class="t">LongShotPluginHost</text>
  <text x="540" y="347" text-anchor="middle" class="s">受控 ABI 加载 Profile DLL</text>
  <path d="M540 374 L540 410" class="line"/>
  <rect x="390" y="412" width="300" height="86" rx="13" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="540" y="445" text-anchor="middle" class="t">ProfileRegistry</text>
  <text x="540" y="471" text-anchor="middle" class="s">按顺序选择首个匹配 Profile</text>
  <path d="M690 455 L735 455 L735 200 L788 200" class="dash"/>
  <rect x="390" y="536" width="300" height="80" rx="13" fill="#1C405E" stroke="#587E9D" stroke-width="2"/>
  <text x="540" y="570" text-anchor="middle" class="ws">Notepad · Explorer · Chromium</text>
  <text x="540" y="595" text-anchor="middle" class="ws">通用滚轮回退</text>
  <path d="M540 536 L540 500" class="back"/>

  <text x="1300" y="48" class="layer">结果策略（Workflow）</text>
  <rect x="1300" y="68" width="240" height="126" rx="14" fill="#DDF3E7" stroke="#45A479" stroke-width="2"/>
  <text x="1420" y="104" text-anchor="middle" class="gt">完整结果</text>
  <text x="1420" y="132" text-anchor="middle" class="s">发布并自动复制</text>
  <text x="1420" y="158" text-anchor="middle" class="xs">ReachedBottom</text>
  <rect x="1300" y="244" width="240" height="126" rx="14" fill="#FFF1D3" stroke="#E4A73E" stroke-width="2"/>
  <text x="1420" y="280" text-anchor="middle" class="t">可信非完整结果</text>
  <text x="1420" y="308" text-anchor="middle" class="s">用户确认后发布</text>
  <text x="1420" y="334" text-anchor="middle" class="xs">首帧 / 已验证部分</text>
  <rect x="1300" y="420" width="240" height="126" rx="14" fill="#FBE7E7" stroke="#D27B7B" stroke-width="2"/>
  <text x="1420" y="456" text-anchor="middle" class="t">取消 / 无可信图像</text>
  <text x="1420" y="484" text-anchor="middle" class="s">丢弃，不发布</text>
  <text x="1420" y="510" text-anchor="middle" class="xs">Cancelled / None</text>
  <path d="M1250 486 L1275 486 L1275 131 L1298 131" class="line"/>
  <path d="M1275 307 L1298 307" class="line"/>
  <path d="M1275 483 L1298 483" class="line"/>
  <rect x="1300" y="586" width="240" height="66" rx="13" fill="#CDEADD" stroke="#45A479" stroke-width="2"/>
  <text x="1420" y="613" text-anchor="middle" class="gt">ResultStore</text>
  <text x="1420" y="637" text-anchor="middle" class="s">正式结果</text>
  <path d="M1540 131 L1570 131 L1570 619 L1542 619" class="line"/>
  <path d="M1540 307 L1558 307 L1558 605 L1542 605" class="line"/>
</svg>
