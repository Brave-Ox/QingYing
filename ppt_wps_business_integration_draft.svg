<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <style>
      .bg{fill:#081827}.title{font:700 32px 'Microsoft YaHei',sans-serif;fill:#F7FBFF}.sub{font:400 15px 'Microsoft YaHei',sans-serif;fill:#AFC2D4}.cap{font:700 15px 'Microsoft YaHei',sans-serif;fill:#91AEC7;letter-spacing:1px}.t{font:700 20px 'Microsoft YaHei',sans-serif;fill:#142A43}.s{font:400 14px 'Microsoft YaHei',sans-serif;fill:#50657A}.xs{font:400 12px 'Microsoft YaHei',sans-serif;fill:#6B8298}.wt{font:700 21px 'Microsoft YaHei',sans-serif;fill:#FFF}.ws{font:400 14px 'Microsoft YaHei',sans-serif;fill:#D9E8F5}.value{font:700 18px 'Microsoft YaHei',sans-serif;fill:#D9E8F5}.line{fill:none;stroke:#8BA6BF;stroke-width:2.6;marker-end:url(#a)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8BA6BF"/></marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect class="bg" width="1600" height="900"/>

  <text x="66" y="70" class="title">WPS业务落地：让AI看见办公桌面</text>
  <text x="66" y="101" class="sub">轻映连接桌面视觉信息，灵犀提升个人效率，Comate沉淀组织能力</text>
  <line x1="66" y1="126" x2="1534" y2="126" stroke="#2A587B"/>

  <!-- source context -->
  <text x="66" y="172" class="cap">真实办公现场</text>
  <rect x="250" y="148" width="1100" height="76" rx="16" fill="#102B40" stroke="#345E7A" stroke-width="2"/>
  <rect x="290" y="168" width="205" height="36" rx="18" fill="#1C405E"/>
  <text x="393" y="192" text-anchor="middle" class="ws">网页与行业系统</text>
  <rect x="545" y="168" width="205" height="36" rx="18" fill="#1C405E"/>
  <text x="648" y="192" text-anchor="middle" class="ws">聊天与协作信息</text>
  <rect x="800" y="168" width="205" height="36" rx="18" fill="#1C405E"/>
  <text x="903" y="192" text-anchor="middle" class="ws">报表与长页资料</text>
  <rect x="1055" y="168" width="255" height="36" rx="18" fill="#1C405E"/>
  <text x="1183" y="192" text-anchor="middle" class="ws">WPS文档 / 表格 / 演示</text>
  <path d="M800 224 L800 267" class="line"/>

  <!-- QingYing capability hub -->
  <rect x="500" y="270" width="600" height="186" rx="22" fill="#174C76" stroke="#67B7E8" stroke-width="3" filter="url(#glow)"/>
  <text x="800" y="315" text-anchor="middle" class="wt">轻映 QingYing</text>
  <text x="800" y="344" text-anchor="middle" class="ws">AI办公的本机桌面视觉入口</text>
  <rect x="555" y="374" width="105" height="42" rx="21" fill="#286195"/>
  <text x="608" y="401" text-anchor="middle" class="ws">截图</text>
  <rect x="680" y="374" width="105" height="42" rx="21" fill="#286195"/>
  <text x="733" y="401" text-anchor="middle" class="ws">长截图</text>
  <rect x="805" y="374" width="105" height="42" rx="21" fill="#286195"/>
  <text x="858" y="401" text-anchor="middle" class="ws">标注</text>
  <rect x="930" y="374" width="105" height="42" rx="21" fill="#286195"/>
  <text x="983" y="401" text-anchor="middle" class="ws">Pin / MCP</text>

  <!-- branches -->
  <path d="M650 456 L650 495 L390 495 L390 535" class="line"/>
  <path d="M950 456 L950 495 L1210 495 L1210 535" class="line"/>

  <!-- Lingxi -->
  <rect x="120" y="538" width="540" height="216" rx="20" fill="#E8E2F6" stroke="#9A7DD1" stroke-width="2.5"/>
  <text x="390" y="581" text-anchor="middle" class="t">WPS 灵犀 · 个人效率</text>
  <text x="390" y="610" text-anchor="middle" class="s">让个人办公助手获得跨应用视觉上下文</text>
  <rect x="165" y="649" width="130" height="54" rx="12" fill="#F6F2FD" stroke="#B29BDD"/>
  <text x="230" y="681" text-anchor="middle" class="s">跨应用取材</text>
  <path d="M295 676 L335 676" class="line"/>
  <rect x="337" y="649" width="130" height="54" rx="12" fill="#F6F2FD" stroke="#B29BDD"/>
  <text x="402" y="681" text-anchor="middle" class="s">理解与总结</text>
  <path d="M467 676 L507 676" class="line"/>
  <rect x="509" y="649" width="110" height="54" rx="12" fill="#F6F2FD" stroke="#B29BDD"/>
  <text x="564" y="681" text-anchor="middle" class="s">生成内容</text>
  <text x="390" y="730" text-anchor="middle" class="xs">文档 · 表格 · PPT素材</text>

  <!-- Comate -->
  <rect x="940" y="538" width="540" height="216" rx="20" fill="#DDF3E7" stroke="#45A479" stroke-width="2.5"/>
  <text x="1210" y="581" text-anchor="middle" class="t">WPS Comate · 组织效率</text>
  <text x="1210" y="610" text-anchor="middle" class="s">将本机视觉能力沉淀为可复用的组织Skill</text>
  <rect x="985" y="649" width="130" height="54" rx="12" fill="#F0FAF5" stroke="#6CBA94"/>
  <text x="1050" y="681" text-anchor="middle" class="s">视觉 Skill</text>
  <path d="M1115 676 L1155 676" class="line"/>
  <rect x="1157" y="649" width="130" height="54" rx="12" fill="#F0FAF5" stroke="#6CBA94"/>
  <text x="1222" y="681" text-anchor="middle" class="s">任务编排</text>
  <path d="M1287 676 L1327 676" class="line"/>
  <rect x="1329" y="649" width="110" height="54" rx="12" fill="#F0FAF5" stroke="#6CBA94"/>
  <text x="1384" y="681" text-anchor="middle" class="s">团队复用</text>
  <text x="1210" y="730" text-anchor="middle" class="xs">标准流程 · 权限控制 · 协同沉淀</text>

  <!-- value statement -->
  <rect x="120" y="800" width="1360" height="58" rx="14" fill="#173C57"/>
  <text x="800" y="836" text-anchor="middle" class="value">从“复制粘贴”升级为“看见 → 理解 → 生成 → 协作”的智能办公闭环</text>
</svg>
